[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-sync-cli"
version = "0.2.2"
description = "Monitor GitHub forks and safely synchronize them with their upstream repositories"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "repo-sync contributors" }]
keywords = ["git", "github", "fork", "sync", "automation", "cli"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
repo-sync = "repo_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
